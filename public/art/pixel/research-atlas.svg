  <title id="ra-title">The cartographer's mountain terrace</title>
  <desc id="ra-desc">A researcher surveys a broad relief atlas on a sunlit mountain balcony. Miniature islands rise from blue chart paper, surrounded by a brass compass, a measuring square, rolled maps and an open notebook. Layered mountain passes stretch beyond the terrace; a travel pack waits beside the table.</desc>
