  <title id="ml-title">Mountain model-training laboratory</title>
  <desc id="ml-desc">A blue and amber model laboratory is built into a mountain overlook. Compute towers, cooling pipes and a compact experiment desk surround a researcher, while layered alpine ridges fill tall windows and snow gathers on the stepped roof.</desc>
