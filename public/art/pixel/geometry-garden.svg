  <title id="gg-title">The garden of quiet proofs</title>
  <desc id="gg-desc">A scholar works at a chalk slate among terraced gardens, weathered stepped stone arches and geometric instruments. A brass-tipped sundial casts a precise shadow across its stone face. Paths wind between flower beds and a small rill that spills into a pool below the mountain gardens.</desc>
