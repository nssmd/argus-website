  <title id="rl-title">The evening research archive</title>
  <desc id="rl-desc">An open, golden-lit library beneath a blue tiled roof. A researcher studies an open book between crowded archive shelves and a telescope. Beyond a mullioned window, a stepped crescent rises over distant mountains. Garden planters flank the worn stone entrance steps.</desc>
