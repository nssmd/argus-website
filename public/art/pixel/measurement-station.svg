  <title id="ms-title">The high-pass measurement station</title>
  <desc id="ms-desc">An alpine researcher records observations at a field workbench beneath a tall calibration mast. A weather vane, square-cup wind sensor, louvered instrument shelter and marked survey stakes stand among snow patches and mountain rock. Notebooks, a portable balance and a gold wind flag tell the story of careful measurements in the open air.</desc>
