<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" shape-rendering="crispEdges" role="img" aria-labelledby="rc-title rc-desc">
  <title id="rc-title">A riverside campus for shared discoveries</title>
  <desc id="rc-desc">A bright, terraced research campus stands among island gardens and blue waterways. Slate-roofed laboratories, a rooftop solar array and a small antenna overlook a timber footbridge. Three researchers meet around an open notebook, with stepping paths, flowering trees and a moored little boat nearby.</desc>
