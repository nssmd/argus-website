  <title id="th-title">Dawn at the mountain trailhead</title>
  <desc id="th-desc">A researcher and a small companion robot begin a winding mountain trail at dawn. A timber bridge crosses a bright creek below a cabin and blank signpost, with layered pines leading toward a distant sunlit summit.</desc>
