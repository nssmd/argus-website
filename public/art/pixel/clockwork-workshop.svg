  <title id="cw-title">The clockwork research atelier</title>
  <desc id="cw-desc">An open mechanic's workshop glows at dusk. A researcher adjusts a wall of interlocking brass gears above a crowded timber bench, while tools, plants, tall windows and an overhead lamp fill the lived-in atelier.</desc>
