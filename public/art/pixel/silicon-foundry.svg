  <title id="sf-title">Silicon foundry at the forest edge</title>
  <desc id="sf-desc">A detailed cutaway microchip cleanroom with a stepped wafer stage, patterned circuit benches, articulated fabrication tools, amber inspection lamps and a tiny suited technician. Pine trees, service roofs and a pale industrial sky surround the compact foundry.</desc>
