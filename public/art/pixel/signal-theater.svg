  <title id="st-title">The rooftop signal theater</title>
  <desc id="st-desc">A small rooftop screening studio comes alive at blue hour. A stepped projector beam reaches a freestanding screen with a simple connected diagram, while seated viewers, an operator desk, antennas, planters and the evening skyline surround the show.</desc>
