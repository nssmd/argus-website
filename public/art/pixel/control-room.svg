  <title id="cr-title">Open runtime coordination tower</title>
  <desc id="cr-desc">An open-sided control tower overlooks a distant city and mountain horizon. Operators work at layered consoles beneath an antenna roof while thick cables, illuminated circuit paths, relay cabinets and a central coordination table connect the room.</desc>
